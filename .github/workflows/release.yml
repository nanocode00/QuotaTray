name: Release QuotaTray

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build & Package (${{ matrix.target.os }})
    runs-on: ${{ matrix.target.runner }}
    env:
      ANTIGRAVITY_OAUTH_CLIENT_ID: ${{ vars.ANTIGRAVITY_OAUTH_CLIENT_ID }}
      ANTIGRAVITY_OAUTH_CLIENT_SECRET: ${{ secrets.ANTIGRAVITY_OAUTH_CLIENT_SECRET }}
    strategy:
      matrix:
        target:
          - os: win-x64
            runner: windows-latest
            artifact_name: QuotaTray-windows-x64.zip
            binary_name: QuotaTray.Desktop.exe
          - os: linux-x64
            runner: ubuntu-latest
            artifact_name: QuotaTray-linux-x64.tar.gz
            binary_name: QuotaTray.Desktop
          - os: osx-arm64
            runner: macos-latest
            artifact_name: QuotaTray-macos-arm64.tar.gz
            binary_name: QuotaTray.Desktop
          - os: osx-x64
            runner: macos-latest
            artifact_name: QuotaTray-macos-x64.tar.gz
            binary_name: QuotaTray.Desktop

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Validate Antigravity OAuth build configuration
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:ANTIGRAVITY_OAUTH_CLIENT_ID)) {
            throw "Missing repository variable ANTIGRAVITY_OAUTH_CLIENT_ID"
          }
          if ([string]::IsNullOrWhiteSpace($env:ANTIGRAVITY_OAUTH_CLIENT_SECRET)) {
            throw "Missing repository secret ANTIGRAVITY_OAUTH_CLIENT_SECRET"
          }

      - name: Publish Single-File Executable
        shell: pwsh
        run: |
          dotnet publish QuotaTray.Desktop/QuotaTray.Desktop.csproj `
            -c Release `
            -r "${{ matrix.target.os }}" `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:AntigravityOAuthClientId="$env:ANTIGRAVITY_OAUTH_CLIENT_ID" `
            -p:AntigravityOAuthClientSecret="$env:ANTIGRAVITY_OAUTH_CLIENT_SECRET" `
            -o ./out

      - name: Package Windows Zip
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path ./out/* -DestinationPath ./${{ matrix.target.artifact_name }}

      - name: Package Unix Tarball
        if: runner.os != 'Windows'
        run: |
          chmod +x ./out/${{ matrix.target.binary_name }}
          tar -czf ./${{ matrix.target.artifact_name }} -C ./out .

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target.artifact_name }}
          path: ./${{ matrix.target.artifact_name }}

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: ./artifacts/**/*
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
